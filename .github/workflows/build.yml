name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The textures are left out: their PNGs go through Node's zlib, whose bytes for the same pixels may differ between
      # machines and Node releases.
      - name: The generated resources are up to date
        run: |
          node tools/generate_resources.mjs > /dev/null
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::tools/generate_resources.mjs writes different files:" \
              "change the generator, rerun it and commit what it writes"
            exit 1
          fi
      - run: ./gradlew build
