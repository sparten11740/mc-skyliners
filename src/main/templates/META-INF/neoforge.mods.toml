modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/${mod_id}/icon.png"
description='''
Giant aircraft laid down whole by a single blueprint: an A380-style airliner, a Hindenburg-style zeppelin and a retro
rocket, big enough to walk around in, furnished inside, and flown by their own autopilots with you aboard.
'''

# Opens a few fields of the creative screen to the tab's section banners, and of the level renderer to the tail
# camera display's picture.
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

# Mends a Veil bug with a window depth that has a stencil (see dev.skyliners.mixin). Not required: should Veil change
# under it, it is left out with a warning in the log.
[[mixins]]
config="skyliners.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Create glues the airframe together for assembly; Create Propulsion gives it wings that lift and thrusters.
[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="createpropulsion"
type="required"
versionRange="*"
ordering="NONE"
side="BOTH"

# Optional but expected: Create Aeronautics' Physics Assembler (Simulated) turns the airliner into a flying
# contraption, and its Offroad wheel mounts carry it on real tires.
[[dependencies.${mod_id}]]
modId="simulated"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"
